[package]
name = "yarc-oci"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OCI registry client, layer store, rootfs assembly"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# also used by tests/live.rs
tempfile = "3"
