[package]
name = "yarc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "yarc command line (host side)"

[[bin]]
name = "yarc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive", "env"] }
yarc-agent = { path = "../yarc-agent" }
yarc-config = { path = "../yarc-config" }
yarc-oci = { path = "../yarc-oci" }
yarc-proto = { path = "../yarc-proto" }
yarc-runtime = { path = "../yarc-runtime" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
