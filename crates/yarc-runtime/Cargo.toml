[package]
name = "yarc-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Container runtime: namespaces, cgroups, overlayfs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yarc-config = { path = "../yarc-config" }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "hostname", "mount", "poll", "process", "sched", "signal", "user"] }

[dev-dependencies]
tempfile = "3"
